name: Build Linux Packages

on:
  push:
    branches: [linux-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Linux ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86_64
            runner: ubuntu-24.04
            arch: x86_64
            deb_arch: amd64
          - label: ARM64
            runner: ubuntu-24.04-arm
            arch: arm64
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev libx11-6 libxext6 libxrender1 libxtst6 libxi6 libxfixes3 libxcb1 libxkbcommon0 libglib2.0-0 libfontconfig1 libfreetype6 libdbus-1-3

      - name: Set package version
        run: echo "JIGARZON_BUILD_VERSION=2.0.0" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller customtkinter pypresence tkinterdnd2 pillow pystray python-xlib

      - name: Generate Linux application icon
        run: |
          mkdir -p assets
          python - <<'PY'
          from PIL import Image, ImageDraw
          im = Image.new("RGBA", (512, 512), (23, 25, 31, 255))
          d = ImageDraw.Draw(im)
          d.polygon([(50,172),(266,36),(266,388),(156,478),(36,478),(156,376),(156,176)], fill="#A33BFF")
          d.polygon([(296,88),(420,174),(420,384),(504,384),(420,478),(296,478)], fill="#16BFEA")
          d.polygon([(266,36),(296,88),(296,478),(266,442)], fill="#5638E8")
          im.save("assets/jigarzon.png")
          PY

      - name: Build Linux application
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed \
            --name JigarzonLauncher \
            --add-data "assets/jigarzon.png:assets" \
            --collect-all customtkinter \
            --collect-all pypresence \
            --collect-all tkinterdnd2 \
            --collect-all pystray \
            --collect-all PIL \
            jigarzon_launcher.py

      - name: Package portable archive
        env:
          LINUX_ARCH: ${{ matrix.arch }}
        run: |
          PACKAGE="JigarzonLauncher-linux-${LINUX_ARCH}"
          mkdir -p "dist/${PACKAGE}"
          cp -a dist/JigarzonLauncher "dist/${PACKAGE}/"
          cat > "dist/${PACKAGE}/run-jigarzon.sh" <<'SH'
          #!/usr/bin/env bash
          HERE="$(cd -- "$(dirname -- "$0")" && pwd)"
          exec "$HERE/JigarzonLauncher/JigarzonLauncher" "$@"
          SH
          chmod +x "dist/${PACKAGE}/run-jigarzon.sh"
          cat > "dist/${PACKAGE}/README.txt" <<TXT
          Jigarzon Launcher for Linux (${LINUX_ARCH})
          Run ./run-jigarzon.sh to start.
          Requires a graphical Linux desktop with X11 or XWayland.
          Note: Horizon currently publishes an official Linux x86_64 launcher only.
          TXT
          tar -C dist -czf "dist/Jigarzon-Launcher-Linux-${LINUX_ARCH}.tar.gz" "${PACKAGE}"

      - name: Build Debian package
        env:
          LINUX_ARCH: ${{ matrix.arch }}
          DEB_ARCH: ${{ matrix.deb_arch }}
        run: |
          PKG="dist/deb-root"
          mkdir -p "$PKG/DEBIAN" "$PKG/opt/JigarzonLauncher" "$PKG/usr/bin" "$PKG/usr/share/applications" "$PKG/usr/share/icons/hicolor/512x512/apps"
          cp -a dist/JigarzonLauncher/. "$PKG/opt/JigarzonLauncher/"
          cp assets/jigarzon.png "$PKG/usr/share/icons/hicolor/512x512/apps/jigarzon-launcher.png"
          ln -s /opt/JigarzonLauncher/JigarzonLauncher "$PKG/usr/bin/jigarzon-launcher"
          cat > "$PKG/usr/share/applications/jigarzon-launcher.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Jigarzon Launcher
          Comment=Launcher for Horizon Minecraft Java Edition
          Exec=jigarzon-launcher
          Icon=jigarzon-launcher
          Terminal=false
          Categories=Game;
          DESKTOP
          cat > "$PKG/DEBIAN/control" <<CONTROL
          Package: jigarzon-launcher
          Version: ${JIGARZON_BUILD_VERSION}
          Section: games
          Priority: optional
          Architecture: ${DEB_ARCH}
          Maintainer: Jigarzon Launcher
          Depends: libx11-6, libxext6, libxrender1, libxtst6, libxi6, libxfixes3, libxcb1, libxkbcommon0, libglib2.0-0, libfontconfig1, libfreetype6, libdbus-1-3
          Description: Jigarzon desktop launcher for Horizon
           A graphical launcher and instance manager for Horizon Minecraft Java Edition.
          CONTROL
          dpkg-deb --build --root-owner-group "$PKG" "dist/Jigarzon-Launcher-Linux-${LINUX_ARCH}.deb"

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: Jigarzon-Launcher-Linux-${{ matrix.arch }}
          path: |
            dist/Jigarzon-Launcher-Linux-${{ matrix.arch }}.deb
            dist/Jigarzon-Launcher-Linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
