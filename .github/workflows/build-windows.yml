name: Build Windows Installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set release version
        shell: pwsh
        run: |
          "JIGARZON_BUILD_VERSION=1.0.0" | Out-File -FilePath $env:GITHUB_ENV -Append
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v(.+)$') {
            "JIGARZON_BUILD_VERSION=$($Matches[1])" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller customtkinter pypresence tkinterdnd2 pillow
      - name: Generate JL application icon
        run: python generate_icon.py
      - name: Build Windows application
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name JigarzonLauncher --icon assets/jigarzon.ico
          --add-data "assets/jigarzon.ico;assets"
          --collect-all customtkinter --collect-all pypresence
          --collect-all tkinterdnd2 jigarzon_launcher.py
      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $inno = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $inno)) {
            throw "Inno Setup compiler not found: $inno"
          }
          & $inno "/DAppVersion=$env:JIGARZON_BUILD_VERSION" "installer.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE"
          }
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Jigarzon-Launcher-Windows
          path: |
            dist/JigarzonLauncher.exe
            dist/Jigarzon-Setup.exe
          if-no-files-found: error
      - name: Publish installer on GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Jigarzon-Setup.exe
