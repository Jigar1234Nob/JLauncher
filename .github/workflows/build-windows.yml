name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller pypresence
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name JigarzonLauncher --collect-all pypresence jigarzon_launcher.py
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jigarzon-Launcher-Windows
          path: dist/JigarzonLauncher.exe
          if-no-files-found: error
      - name: Attach executable to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/JigarzonLauncher.exe
